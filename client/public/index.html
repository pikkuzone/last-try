<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OLDOON - Study Loud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { font-family: 'Inter', sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%); }
    .card-glow { box-shadow: 0 0 0 1px rgba(99,102,241,0.2), 0 4px 24px rgba(99,102,241,0.08); }
    .pulse-dot { animation: pulse 2s cubic-bezier(0.4,0,0.6,1) infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .fade-in { animation: fadeIn 0.4s ease forwards; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .msg-bubble { animation: fadeIn 0.2s ease forwards; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 4px; }
  </style>
</head>
<body class="gradient-bg min-h-screen text-white">

  <!-- ── AUTH SCREEN ─────────────────────────────────────────── -->
  <div id="authScreen" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md fade-in">

      <!-- Logo -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600 mb-4 shadow-lg shadow-indigo-500/30">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
          </svg>
        </div>
        <h1 class="text-3xl font-extrabold tracking-tight">OLDOON</h1>
        <p class="text-indigo-300 mt-1 text-sm font-medium">Study Loud — Together</p>
      </div>

      <!-- Tab switcher -->
      <div class="flex bg-white/5 rounded-xl p-1 mb-6 border border-white/10">
        <button id="tabLogin" onclick="switchTab('login')"
          class="flex-1 py-2 rounded-lg text-sm font-semibold transition-all bg-indigo-600 text-white shadow">
          Sign In
        </button>
        <button id="tabRegister" onclick="switchTab('register')"
          class="flex-1 py-2 rounded-lg text-sm font-semibold transition-all text-slate-400 hover:text-white">
          Create Account
        </button>
      </div>

      <!-- Login form -->
      <div id="loginForm" class="card-glow bg-white/5 border border-white/10 rounded-2xl p-6 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">Email</label>
          <input id="loginEmail" type="email" placeholder="you@example.com"
            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">Password</label>
          <input id="loginPassword" type="password" placeholder="••••••••"
            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition" />
        </div>
        <p id="loginError" class="text-red-400 text-xs hidden"></p>
        <button onclick="doLogin()"
          class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition-all shadow-lg shadow-indigo-500/20 text-sm">
          Sign In
        </button>
      </div>

      <!-- Register form -->
      <div id="registerForm" class="card-glow bg-white/5 border border-white/10 rounded-2xl p-6 space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">Full Name</label>
          <input id="regName" type="text" placeholder="Your name"
            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">Email</label>
          <input id="regEmail" type="email" placeholder="you@example.com"
            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">Password</label>
          <input id="regPassword" type="password" placeholder="Min. 6 characters"
            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition" />
        </div>
        <p id="regError" class="text-red-400 text-xs hidden"></p>
        <button onclick="doRegister()"
          class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition-all shadow-lg shadow-indigo-500/20 text-sm">
          Create Account
        </button>
      </div>

      <!-- Status badge -->
      <div class="mt-6 flex items-center justify-center gap-2 text-xs text-slate-500">
        <span id="serverStatusDot" class="w-2 h-2 rounded-full bg-slate-600"></span>
        <span id="serverStatusText">Connecting to server…</span>
      </div>
    </div>
  </div>

  <!-- ── APP SCREEN ──────────────────────────────────────────── -->
  <div id="appScreen" class="hidden min-h-screen flex flex-col">

    <!-- Top nav -->
    <header class="border-b border-white/10 bg-black/20 backdrop-blur-sm sticky top-0 z-10">
      <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center shadow shadow-indigo-500/30">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
            </svg>
          </div>
          <span class="font-bold text-sm tracking-tight">OLDOON</span>
        </div>

        <nav class="hidden sm:flex items-center gap-1">
          <button onclick="showTab('rooms')" id="navRooms"
            class="nav-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition-all bg-indigo-600 text-white">
            Vibe Rooms
          </button>
          <button onclick="showTab('buddies')" id="navBuddies"
            class="nav-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition-all text-slate-400 hover:text-white hover:bg-white/5">
            Study Buddies
          </button>
        </nav>

        <div class="flex items-center gap-3">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400 pulse-dot"></span>
            <span id="socketStatusText" class="text-xs text-slate-400">Connecting…</span>
          </div>
          <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-xs font-bold cursor-pointer"
            id="userAvatar" title="Sign out" onclick="doLogout()">?</div>
        </div>
      </div>
    </header>

    <!-- Mobile nav -->
    <div class="sm:hidden flex border-b border-white/10 bg-black/10">
      <button onclick="showTab('rooms')" id="mNavRooms"
        class="flex-1 py-2.5 text-xs font-semibold text-white border-b-2 border-indigo-500">Vibe Rooms</button>
      <button onclick="showTab('buddies')" id="mNavBuddies"
        class="flex-1 py-2.5 text-xs font-semibold text-slate-400 border-b-2 border-transparent">Study Buddies</button>
    </div>

    <!-- Main content -->
    <main class="flex-1 max-w-6xl mx-auto w-full px-4 py-6">

      <!-- ── ROOMS TAB ──────────────────────────────────────── -->
      <div id="tabRooms" class="fade-in">
        <div class="flex items-center justify-between mb-5">
          <div>
            <h2 class="text-lg font-bold">Vibe Rooms</h2>
            <p class="text-slate-400 text-xs mt-0.5">Join a room and study together in real time</p>
          </div>
        </div>

        <!-- Room grid -->
        <div id="roomGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-8">
          <div class="col-span-full text-center text-slate-500 text-sm py-8">Loading rooms…</div>
        </div>

        <!-- Active room chat -->
        <div id="roomChatPanel" class="hidden card-glow bg-white/5 border border-white/10 rounded-2xl overflow-hidden">
          <div class="flex items-center justify-between px-5 py-3 border-b border-white/10 bg-black/20">
            <div>
              <p class="font-semibold text-sm" id="activeChatRoomName">Room</p>
              <p class="text-xs text-slate-400" id="activeChatRoomTag"></p>
            </div>
            <button onclick="leaveRoom()"
              class="text-xs text-slate-400 hover:text-red-400 transition font-medium px-3 py-1.5 rounded-lg hover:bg-red-500/10">
              Leave
            </button>
          </div>
          <div id="chatMessages" class="h-64 overflow-y-auto p-4 space-y-2 flex flex-col"></div>
          <div class="px-4 pb-4 pt-2 flex gap-2">
            <input id="chatInput" type="text" placeholder="Say something…"
              class="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
              onkeydown="if(event.key==='Enter') sendRoomMessage()" />
            <button onclick="sendRoomMessage()"
              class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-xl text-sm font-semibold transition">
              Send
            </button>
          </div>
        </div>
      </div>

      <!-- ── BUDDIES TAB ─────────────────────────────────────── -->
      <div id="tabBuddies" class="hidden fade-in">
        <div class="mb-5">
          <h2 class="text-lg font-bold">Study Buddies</h2>
          <p class="text-slate-400 text-xs mt-0.5">Find people studying the same thing as you</p>
        </div>
        <div class="mb-4">
          <input id="buddySearch" type="text" placeholder="Search by name, course, or tag…"
            oninput="loadBuddies()"
            class="w-full max-w-sm bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition" />
        </div>
        <div id="buddyGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          <div class="col-span-full text-center text-slate-500 text-sm py-8">Loading buddies…</div>
        </div>
      </div>

    </main>
  </div>

  <!-- ── TOAST ───────────────────────────────────────────────── -->
  <div id="toast"
    class="fixed bottom-5 right-5 bg-slate-800 border border-white/10 text-white text-sm px-4 py-3 rounded-xl shadow-xl hidden fade-in max-w-xs z-50">
  </div>

  <script>
    // ── State ──────────────────────────────────────────────────
    let token = localStorage.getItem('oldoon_token') || null;
    let currentUser = null;
    let socket = null;
    let activeRoomId = null;

    // ── Helpers ────────────────────────────────────────────────
    function showToast(msg, duration = 3000) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.add('hidden'), duration);
    }

    function setServerStatus(connected) {
      const dot = document.getElementById('serverStatusDot');
      const txt = document.getElementById('serverStatusText');
      if (connected) {
        dot.className = 'w-2 h-2 rounded-full bg-emerald-400';
        txt.textContent = 'Backend connected';
      } else {
        dot.className = 'w-2 h-2 rounded-full bg-red-400';
        txt.textContent = 'Cannot reach server';
      }
    }

    function setSocketStatus(connected) {
      const txt = document.getElementById('socketStatusText');
      if (txt) txt.textContent = connected ? 'Live ✓' : 'Reconnecting…';
    }

    async function apiFetch(path, opts = {}) {
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers['Authorization'] = `Bearer ${token}`;
      const res = await fetch(path, { ...opts, headers: { ...headers, ...(opts.headers || {}) } });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    }

    // ── Auth tab switch ────────────────────────────────────────
    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
      document.getElementById('registerForm').classList.toggle('hidden', isLogin);
      document.getElementById('tabLogin').className =
        `flex-1 py-2 rounded-lg text-sm font-semibold transition-all ${isLogin ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`;
      document.getElementById('tabRegister').className =
        `flex-1 py-2 rounded-lg text-sm font-semibold transition-all ${!isLogin ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'}`;
    }

    // ── Login ──────────────────────────────────────────────────
    async function doLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const errEl = document.getElementById('loginError');
      errEl.classList.add('hidden');
      try {
        const data = await apiFetch('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });
        token = data.token;
        localStorage.setItem('oldoon_token', token);
        currentUser = data.user;
        enterApp();
      } catch (e) {
        errEl.textContent = e.message;
        errEl.classList.remove('hidden');
      }
    }

    // ── Register ───────────────────────────────────────────────
    async function doRegister() {
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const errEl = document.getElementById('regError');
      errEl.classList.add('hidden');
      try {
        const data = await apiFetch('/api/auth/register', {
          method: 'POST',
          body: JSON.stringify({ name, email, password })
        });
        token = data.token;
        localStorage.setItem('oldoon_token', token);
        currentUser = data.user;
        enterApp();
      } catch (e) {
        errEl.textContent = e.message;
        errEl.classList.remove('hidden');
      }
    }

    // ── Logout ─────────────────────────────────────────────────
    function doLogout() {
      if (!confirm('Sign out?')) return;
      localStorage.removeItem('oldoon_token');
      token = null;
      currentUser = null;
      if (socket) { socket.disconnect(); socket = null; }
      activeRoomId = null;
      document.getElementById('appScreen').classList.add('hidden');
      document.getElementById('authScreen').classList.remove('hidden');
    }

    // ── Enter app ──────────────────────────────────────────────
    function enterApp() {
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('appScreen').classList.remove('hidden');

      const initials = (currentUser?.name || '?').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
      document.getElementById('userAvatar').textContent = initials;

      connectSocket();
      showTab('rooms');
      loadRooms();
    }

    // ── App tab navigation ─────────────────────────────────────
    function showTab(tab) {
      ['rooms', 'buddies'].forEach(t => {
        document.getElementById(`tab${t.charAt(0).toUpperCase() + t.slice(1)}`).classList.toggle('hidden', t !== tab);
        // desktop nav
        const btn = document.getElementById(`nav${t.charAt(0).toUpperCase() + t.slice(1)}`);
        if (btn) btn.className = `nav-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${t === tab ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white hover:bg-white/5'}`;
        // mobile nav
        const mBtn = document.getElementById(`mNav${t.charAt(0).toUpperCase() + t.slice(1)}`);
        if (mBtn) mBtn.className = `flex-1 py-2.5 text-xs font-semibold border-b-2 transition-all ${t === tab ? 'text-white border-indigo-500' : 'text-slate-400 border-transparent'}`;
      });
      if (tab === 'buddies') loadBuddies();
    }

    // ── Socket.IO ──────────────────────────────────────────────
    function connectSocket() {
      if (socket) socket.disconnect();
      socket = io({ auth: { token } });

      socket.on('connect', () => {
        setSocketStatus(true);
      });
      socket.on('disconnect', () => setSocketStatus(false));
      socket.on('connect_error', () => setSocketStatus(false));

      socket.on('room:message', (msg) => {
        if (msg.roomId === activeRoomId) appendChatMessage(msg);
      });

      socket.on('room:history', (msgs) => {
        const container = document.getElementById('chatMessages');
        container.innerHTML = '';
        msgs.forEach(appendChatMessage);
        container.scrollTop = container.scrollHeight;
      });

      socket.on('room:joined', ({ name }) => {
        appendSystemMessage(`${name} joined the room`);
      });

      socket.on('room:left', ({ name }) => {
        appendSystemMessage(`${name} left the room`);
      });

      socket.on('room:occupants', ({ roomId, count }) => {
        const el = document.getElementById(`occ-${roomId}`);
        if (el) el.textContent = `${count} online`;
      });

      socket.on('notification', ({ type, fromName }) => {
        if (type === 'connection_request') showToast(`📬 ${fromName} sent you a buddy request!`);
      });
    }

    // ── Rooms ──────────────────────────────────────────────────
    async function loadRooms() {
      try {
        const rooms = await apiFetch('/api/rooms');
        renderRooms(rooms);
      } catch (e) {
        document.getElementById('roomGrid').innerHTML =
          `<div class="col-span-full text-center text-red-400 text-sm py-8">Failed to load rooms: ${e.message}</div>`;
      }
    }

    const TAG_COLORS = {
      'B.Tech CSE': 'bg-blue-500/20 text-blue-300',
      'NEET': 'bg-green-500/20 text-green-300',
      'UPSC': 'bg-orange-500/20 text-orange-300',
      'Class 12': 'bg-pink-500/20 text-pink-300',
      'JEE': 'bg-yellow-500/20 text-yellow-300',
      'MBA': 'bg-purple-500/20 text-purple-300',
      'General': 'bg-slate-500/20 text-slate-300',
    };

    function renderRooms(rooms) {
      const grid = document.getElementById('roomGrid');
      if (!rooms.length) {
        grid.innerHTML = '<div class="col-span-full text-center text-slate-500 text-sm py-8">No rooms yet.</div>';
        return;
      }
      grid.innerHTML = rooms.map(r => {
        const tagClass = TAG_COLORS[r.tag] || 'bg-slate-500/20 text-slate-300';
        const isActive = r.id === activeRoomId;
        return `
          <div class="card-glow bg-white/5 border ${isActive ? 'border-indigo-500' : 'border-white/10'} rounded-2xl p-5 flex flex-col gap-3 hover:border-indigo-500/50 transition-all cursor-pointer group"
            onclick="joinRoom('${r.id}', '${escHtml(r.name)}', '${escHtml(r.tag)}')">
            <div class="flex items-start justify-between gap-2">
              <p class="font-semibold text-sm leading-snug group-hover:text-indigo-300 transition">${escHtml(r.name)}</p>
              <span class="shrink-0 text-xs px-2 py-0.5 rounded-full font-medium ${tagClass}">${escHtml(r.tag)}</span>
            </div>
            <p class="text-xs text-slate-400 leading-relaxed">${escHtml(r.desc || '')}</p>
            <div class="flex items-center justify-between mt-auto pt-1">
              <span id="occ-${r.id}" class="text-xs text-slate-500">${r.occupants || 0} online</span>
              <span class="text-xs text-slate-500">Max ${r.maxPeople}</span>
            </div>
            ${isActive ? '<div class="text-xs text-indigo-400 font-semibold">✓ You\'re in this room</div>' : ''}
          </div>`;
      }).join('');
    }

    function joinRoom(roomId, name, tag) {
      if (!socket?.connected) { showToast('Not connected — please wait…'); return; }
      if (activeRoomId === roomId) {
        // scroll to chat
        document.getElementById('roomChatPanel').scrollIntoView({ behavior: 'smooth' });
        return;
      }
      activeRoomId = roomId;
      socket.emit('room:join', { roomId });

      document.getElementById('activeChatRoomName').textContent = name;
      document.getElementById('activeChatRoomTag').textContent = tag;
      document.getElementById('chatMessages').innerHTML = '';
      document.getElementById('roomChatPanel').classList.remove('hidden');
      document.getElementById('roomChatPanel').scrollIntoView({ behavior: 'smooth' });

      loadRooms(); // refresh to highlight active room
    }

    function leaveRoom() {
      if (!socket || !activeRoomId) return;
      socket.emit('room:leave');
      activeRoomId = null;
      document.getElementById('roomChatPanel').classList.add('hidden');
      loadRooms();
    }

    function sendRoomMessage() {
      const input = document.getElementById('chatInput');
      const content = input.value.trim();
      if (!content || !activeRoomId || !socket?.connected) return;
      socket.emit('room:message', { roomId: activeRoomId, content });
      input.value = '';
    }

    function appendChatMessage(msg) {
      const container = document.getElementById('chatMessages');
      const isMe = msg.userId === currentUser?.id;
      const time = new Date(msg.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const div = document.createElement('div');
      div.className = `msg-bubble flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
      div.innerHTML = `
        <div class="flex items-baseline gap-1.5 mb-0.5">
          ${!isMe ? `<span class="text-xs font-semibold text-indigo-300">${escHtml(msg.name)}</span>` : ''}
          <span class="text-xs text-slate-500">${time}</span>
        </div>
        <div class="max-w-xs px-3 py-2 rounded-xl text-sm ${isMe ? 'bg-indigo-600 text-white rounded-br-sm' : 'bg-white/10 text-slate-100 rounded-bl-sm'}">
          ${escHtml(msg.content)}
        </div>`;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function appendSystemMessage(text) {
      const container = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = 'text-center text-xs text-slate-500 py-1';
      div.textContent = text;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    // ── Buddies ────────────────────────────────────────────────
    async function loadBuddies() {
      const search = document.getElementById('buddySearch')?.value.trim() || '';
      const params = new URLSearchParams();
      if (search) params.set('search', search);
      try {
        const buddies = await apiFetch(`/api/buddies?${params}`);
        renderBuddies(buddies);
      } catch (e) {
        document.getElementById('buddyGrid').innerHTML =
          `<div class="col-span-full text-center text-red-400 text-sm py-8">Failed to load buddies: ${e.message}</div>`;
      }
    }

    function renderBuddies(buddies) {
      const grid = document.getElementById('buddyGrid');
      if (!buddies.length) {
        grid.innerHTML = '<div class="col-span-full text-center text-slate-500 text-sm py-8">No study buddies found. Be the first!</div>';
        return;
      }
      grid.innerHTML = buddies.map(b => {
        const initials = (b.name || '?').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
        const statusColor = b.isOnline ? 'bg-emerald-400' : 'bg-slate-600';
        const connStatus = b.connectionStatus;
        let connBtn = '';
        if (connStatus === 'none') {
          connBtn = `<button onclick="connectBuddy('${b.userId}', this)"
            class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg font-semibold transition">
            Connect
          </button>`;
        } else if (connStatus === 'pending') {
          connBtn = `<span class="text-xs text-yellow-400 font-medium">Pending…</span>`;
        } else if (connStatus === 'accepted') {
          connBtn = `<span class="text-xs text-emerald-400 font-medium">✓ Connected</span>`;
        }
        return `
          <div class="card-glow bg-white/5 border border-white/10 rounded-2xl p-5 flex flex-col gap-3">
            <div class="flex items-center gap-3">
              <div class="relative">
                <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center text-sm font-bold shrink-0">
                  ${initials}
                </div>
                <span class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full ${statusColor} border-2 border-slate-900"></span>
              </div>
              <div class="min-w-0">
                <p class="font-semibold text-sm truncate">${escHtml(b.name || 'Unknown')}</p>
                <p class="text-xs text-slate-400 truncate">${escHtml(b.course || b.level || 'Student')}</p>
              </div>
            </div>
            ${b.bio ? `<p class="text-xs text-slate-400 leading-relaxed line-clamp-2">${escHtml(b.bio)}</p>` : ''}
            ${b.tags?.length ? `<div class="flex flex-wrap gap-1">${b.tags.slice(0, 3).map(t => `<span class="text-xs bg-white/10 text-slate-300 px-2 py-0.5 rounded-full">${escHtml(t)}</span>`).join('')}</div>` : ''}
            <div class="flex items-center justify-between mt-auto pt-1">
              <span class="text-xs text-slate-500">${b.isOnline ? 'Online now' : 'Offline'}</span>
              ${connBtn}
            </div>
          </div>`;
      }).join('');
    }

    async function connectBuddy(toUserId, btn) {
      btn.disabled = true;
      btn.textContent = '…';
      try {
        await apiFetch('/api/buddies/connect', { method: 'POST', body: JSON.stringify({ toUserId }) });
        btn.outerHTML = `<span class="text-xs text-yellow-400 font-medium">Pending…</span>`;
        showToast('Connection request sent!');
      } catch (e) {
        showToast(`Error: ${e.message}`);
        btn.disabled = false;
        btn.textContent = 'Connect';
      }
    }

    // ── Utility ────────────────────────────────────────────────
    function escHtml(str) {
      return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Boot ───────────────────────────────────────────────────
    (async function boot() {
      // Probe server health
      try {
        await fetch('/api/rooms');
        setServerStatus(true);
      } catch {
        setServerStatus(false);
      }

      if (token) {
        try {
          currentUser = await apiFetch('/api/auth/me');
          enterApp();
        } catch {
          localStorage.removeItem('oldoon_token');
          token = null;
        }
      }
    })();
  </script>
</body>
</html>
